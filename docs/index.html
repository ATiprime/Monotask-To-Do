<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1013">
  <title>Monotask 移动端</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1013;
      --surface: #191b20;
      --surface-2: #202329;
      --border: #2b2e36;
      --text: #f3f1eb;
      --muted: #8b8e97;
      --dim: #62666f;
      --amber: #e7a85c;
      --green: #74c08e;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI",
        "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(100% 45% at 50% -8%, rgba(231, 168, 92, 0.1), transparent 65%),
        radial-gradient(90% 40% at 80% 100%, rgba(116, 192, 142, 0.07), transparent 65%),
        var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      width: min(100%, 640px);
      margin: 0 auto;
      padding:
        calc(var(--safe-top) + 44px)
        20px
        calc(var(--safe-bottom) + 30px);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--amber);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
    }
    h1 {
      margin: 0;
      font-size: 31px;
      line-height: 1.15;
      letter-spacing: 0.01em;
    }
    .lead {
      margin: 13px 0 0;
      max-width: 500px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }
    .apps {
      display: grid;
      gap: 14px;
      margin-top: 32px;
    }
    .app-card {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.022), transparent 50%),
        var(--surface);
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .app-card:active { transform: scale(0.99); }
    .app-card[data-app="quick"]:hover { border-color: rgba(231, 168, 92, 0.45); }
    .app-card[data-app="weeder"]:hover { border-color: rgba(116, 192, 142, 0.45); }
    .app-icon {
      flex: 0 0 auto;
      width: 58px;
      height: 58px;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.26);
    }
    .app-copy { flex: 1; min-width: 0; }
    .app-copy h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
    }
    .app-copy p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .app-arrow {
      flex: 0 0 auto;
      color: var(--dim);
      font-size: 21px;
      line-height: 1;
    }
    .note {
      margin-top: 26px;
      padding: 16px 17px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--surface-2);
    }
    .note h3 {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .note p {
      margin: 0;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.75;
    }
    .foot {
      margin-top: 26px;
      color: #4f535c;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">MONOTASK MOBILE</p>
    <h1>轻量悬浮待办，装进手机。</h1>
    <p class="lead">两个独立 App，分别负责快捷清单和除草器。无需应用商店，添加到主屏幕即可独立运行，并保留离线数据。</p>

    <section class="apps" aria-label="应用列表">
      <a class="app-card" data-app="quick" href="./quick/">
        <img class="app-icon" src="./quick/icons/icon-192.png" alt="" width="58" height="58">
        <span class="app-copy">
          <h2>快捷清单</h2>
          <p>最多五项 · 拖动排序 · 勾选划线</p>
        </span>
        <span class="app-arrow" aria-hidden="true">›</span>
      </a>

      <a class="app-card" data-app="weeder" href="./weeder/">
        <img class="app-icon" src="./weeder/icons/icon-192.png" alt="" width="58" height="58">
        <span class="app-copy">
          <h2>除草器</h2>
          <p>勾选完成 · 一键清除 · 6 秒撤回</p>
        </span>
        <span class="app-arrow" aria-hidden="true">›</span>
      </a>
    </section>

    <section class="note">
      <h3>安装为独立 App</h3>
      <p>Android：在 Chrome 菜单选择“安装应用”；iPhone：用 Safari 打开各 App 页面，点击分享后选择“添加到主屏幕”。两个 App 需要分别添加。</p>
    </section>

    <p class="foot">PWA · LOCAL-FIRST · SYNC-READY</p>
  </main>
</body>
</html>
