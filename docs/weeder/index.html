<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121713">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="除草器">
  <meta name="description" content="Monotask 除草器：勾选事项并一键清除。">
  <title>除草器 · Monotask</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand-block">
        <h1 class="brand-title"><span class="brand-mark"></span>除草器</h1>
        <p class="brand-subtitle">勾选后一键清除</p>
      </div>
      <div class="header-actions">
        <span class="count-pill" id="count">0 项</span>
        <button class="install-btn" id="installBtn" type="button" aria-label="安装到主屏幕" hidden>
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v11"></path>
            <path d="m8 10 4 4 4-4"></path>
            <path d="M5 19h14"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="content">
      <section class="weed-list" id="list" role="list" aria-label="除草器清单"></section>
    </main>

    <footer class="footer">
      <button class="action-btn" id="clearBtn" type="button" disabled>暂无已勾选项</button>
      <form class="composer" id="composer" autocomplete="off">
        <input id="input" type="text" maxlength="240" enterkeyhint="done" placeholder="添加事项，回车确认" aria-label="添加事项">
        <button class="add-btn" id="addBtn" type="submit" aria-label="添加">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <template id="rowTemplate">
    <article class="todo-row" role="listitem">
      <button class="check-btn" type="button" data-action="toggle" aria-label="标记完成" aria-pressed="false">
        <span class="checkbox">
          <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.7 7.3 5.6 10.1 11.3 4.1"></path></svg>
        </span>
      </button>
      <span class="todo-text"></span>
      <button class="delete-btn" type="button" data-action="delete" aria-label="删除">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5 12.5 12.5M12.5 3.5 3.5 12.5"></path></svg>
      </button>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
